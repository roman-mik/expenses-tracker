name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      # Build-time only — nothing hits Supabase during `next build`, so dummy
      # values are enough to satisfy the env checks in src/lib/supabase/*.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
    steps:
      - uses: actions/checkout@v5

      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            db:
              - 'supabase/**'
              - 'apps/web/src/lib/supabase/**'
              - '**/*.itest.ts'

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - if: github.event_name != 'pull_request' || steps.filter.outputs.db == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - run: pnpm install --frozen-lockfile
      - name: Verify generated theme.css matches tokens.ts
        run: pnpm --filter @kapa/ui build:theme && git diff --exit-code packages/ui/theme.css
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - if: github.event_name != 'pull_request' || steps.filter.outputs.db == 'true'
        run: supabase start
      - if: github.event_name != 'pull_request' || steps.filter.outputs.db == 'true'
        run: pnpm run test:db
      - if: github.event_name != 'pull_request' || steps.filter.outputs.db == 'true'
        run: pnpm run test:integration
      - name: Verify generated database.types.ts matches the migrations
        if: github.event_name != 'pull_request' || steps.filter.outputs.db == 'true'
        run: pnpm run gen:types && git diff --exit-code apps/web/src/lib/supabase/database.types.ts
      - if: github.event_name != 'pull_request' || steps.filter.outputs.db == 'true'
        run: supabase stop
      - run: pnpm run build

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: npx vercel pull --yes --environment=production
      - run: npx vercel build --prod
      - run: npx vercel deploy --prebuilt --prod
